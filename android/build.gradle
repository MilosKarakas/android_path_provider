group 'com.mix1009.android_path_provider'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.5.30'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// The Kotlin Gradle Plugin is not applied here. With AGP 9+ and built-in
// Kotlin, AGP compiles Kotlin itself. Otherwise (AGP < 9 or
// android.builtInKotlin=false) the Flutter Gradle plugin applies
// kotlin-android to this project. Flutter warns about any plugin whose build
// file applies KGP, even conditionally, so do not add it back.

android {
    // Required by AGP 8+; the guard keeps older AGP versions working.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.mix1009.android_path_provider'
    }

    // Current AndroidX libraries require compiling against API 34+.
    compileSdkVersion 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 16
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
}

// The Kotlin standard library is added automatically by both built-in Kotlin
// and the Kotlin Gradle Plugin, so it is not declared here.

// Only when the Kotlin Gradle Plugin is applied (by Flutter). Built-in Kotlin
// already matches jvmTarget to compileOptions.targetCompatibility. The value
// is read lazily so it follows the host app if it overrides compileOptions.
plugins.withId("org.jetbrains.kotlin.android") {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions.jvmTarget.set(project.provider {
            org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
                    android.compileOptions.targetCompatibility.toString())
        })
    }
}
